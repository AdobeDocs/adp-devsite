name: Playwright

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Generate Linux visual baselines instead of comparing them
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Chromium end-to-end and visual tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Pin the browser, OS dependencies, and Node 24 environment used both by
      # GitHub Actions and Act. Keep this version aligned with @playwright/test.
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --ipc=host
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve branch preview URL
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            branch="$GITHUB_HEAD_REF"
          else
            branch="$GITHUB_REF_NAME"
          fi
          branch="${branch,,}"
          branch="${branch//\//-}"
          echo "PLAYWRIGHT_BASE_URL=https://${branch}--adp-devsite-stage--adobedocs.aem.page" >> "$GITHUB_ENV"

      - name: Validate target URL
        shell: bash
        run: |
          if [[ -z "$PLAYWRIGHT_BASE_URL" || "$PLAYWRIGHT_BASE_URL" != https://* ]]; then
            echo "PLAYWRIGHT_BASE_URL must be a non-empty HTTPS URL" >&2
            exit 1
          fi
          echo "Testing $PLAYWRIGHT_BASE_URL"

      - name: Install dependencies
        run: npm ci

      - name: Test Playwright reporting scripts
        run: npm run test:playwright-reporting

      - name: Wait for branch preview
        shell: bash
        run: |
          reference_url="$PLAYWRIGHT_BASE_URL/dev-docs-reference/blocks/accordion/?ci=$GITHUB_SHA"
          script_url="$PLAYWRIGHT_BASE_URL/hlx_statics/scripts/scripts.js?ci=$GITHUB_SHA"
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "$reference_url" >/dev/null \
              && curl --fail --silent --show-error "$script_url" >/dev/null; then
              echo "Reference page and branch assets are ready"
              exit 0
            fi
            echo "Waiting for branch preview (attempt $attempt/30)"
            sleep 10
          done
          echo "Branch preview did not become ready: $PLAYWRIGHT_BASE_URL" >&2
          exit 1

      - name: Run Playwright tests
        id: playwright
        if: github.event_name != 'workflow_dispatch' || !inputs.update_snapshots
        run: npm run test:e2e
        continue-on-error: true

      - name: Generate Linux snapshots
        if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots
        run: npm run test:e2e:update

      - name: Build PR summary
        if: always() && github.event_name == 'pull_request'
        run: node scripts/playwright-summary.mjs
        env:
          TEST_OUTCOME: ${{ steps.playwright.outcome }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Upload Playwright report
        if: always() && env.ACT != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            playwright-results.json
            playwright-summary.md
            test-results/
          if-no-files-found: warn
          retention-days: 14

      # Act 0.2.89's local artifact server does not yet support the v7 upload
      # protocol. Keep this local-only fallback until nektos/act#6114 lands.
      - name: Upload Playwright report with Act
        if: always() && env.ACT == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.sha }}
          path: |
            playwright-report/
            playwright-results.json
            playwright-summary.md
            test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload generated snapshots
        if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots && env.ACT != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-linux-snapshots-${{ github.sha }}
          path: tests/playwright/**/*-snapshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated snapshots with Act
        if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots && env.ACT == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-linux-snapshots-${{ github.sha }}
          path: tests/playwright/**/*-snapshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Update PR description
        if: >-
          always() &&
          env.ACT != 'true' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]'
        run: node scripts/update-playwright-pr-body.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Fail the check if Playwright failed
        if: steps.playwright.outcome == 'failure'
        run: exit 1
